name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run shared domain unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :domain:test --no-daemon

  android-assemble:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # android-actions/setup-android@v3 fails on current runners (sdkmanager "tools" package removed).
      - name: Install Android SDK components
        run: |
          SDKM=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          echo "sdk.dir=${ANDROID_HOME}" >> android/local.properties
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
